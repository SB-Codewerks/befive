# Local design-partner stack. Image tags for the dev dependencies
# are recorded as A-6 in docs/decisions.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: befive
      POSTGRES_PASSWORD: befive
      POSTGRES_DB: befive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U befive -d befive"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:2026.08.5
    environment:
      SERVICES: iam,kms,lambda
    ports:
      - "4566:4566"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"

  echo:
    image: traefik/whoami:v1.10

  mock-idp:
    build:
      context: ../test/support/mock-idp
    environment:
      MOCK_IDP_PORT: "8088"
    ports:
      - "8088:8088"

  befive:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BEFIVE_ROLE: all
      BEFIVE_EVAL: "true"
      BEFIVE_DB_URL: jdbc:postgresql://postgres:5432/befive
      BEFIVE_DB_USER: befive
      BEFIVE_DB_PASSWORD: befive
      BEFIVE_DB_STARTUP_TIMEOUT_MS: "60000"
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/befive/lkg:uid=10001,gid=10001
    ports:
      - "8080:8080"
      - "9000:9000"
      - "9901:9901"
    mem_limit: 1g
